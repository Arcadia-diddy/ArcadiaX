<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon-32x32.png" type="image/x-icon">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArcadiaX - Applications</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #5e60ce, #7400b8);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 20px;
      text-align: center;
      background-color: rgba(0, 0, 0, 0.3);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      font-size: 2em;
      position: relative;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 40px;
      width: 90%;
      max-width: 1200px;
      margin-bottom: 80px; /* space for bottom button */
    }

    .app-button {
      background-color: rgba(255, 255, 255, 0.1);
      border: 2px solid white;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      font-size: 1.2em;
      color: white;
      text-decoration: none;
      transition: background-color 0.3s, transform 0.2s;
    }

    .app-button:hover {
      background-color: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    footer {
      padding: 20px;
      text-align: center;
      font-size: 0.9em;
      opacity: 0.8;
    }
body {
  box-sizing: border-box;
  padding-left: 10px; /* add some padding so content doesn't hug screen edge */
  margin: 0;
}

#backButton {
  position: absolute;
  top: 10px;
  left: 10px; /* reset to 10px */
  background-color: rgba(255, 255, 255, 0.15);
  color: white;
  text-decoration: none;
  border: 1px solid white;
  padding: 3px 6px;
  font-size: 0.65em;
  border-radius: 5px;
  transition: background-color 0.3s, transform 0.2s;
  margin: 0;
  display: inline-block;
  box-sizing: border-box;
  z-index: 1000;
}


  </style>
</head>
<body>
  <header>
    <a href="index.html" id="backButton">← Back to Home</a>
    ArcadiaX Applications
  </header>


  <div class="app-grid">
    <a href="applications/prox/proxy.html" class="app-button">web proxy [beta]</a>
    <a href="applications/clai.html" class="app-button">ChatGPT</a>
    <a href="applications/rammerhead.html" class="app-button">RammerHead Browser</a>
    <!-- Add more app links here -->
  </div>

  <footer>
    &copy; 2025 ArcadiaX OtisSlay. All rights reserved.
  </footer>
</body>
</html>
